[package]
name = "yogurt"
version = "1.0.0"
edition = "2024"

[features]
default = []
whisper = ["dep:whisper-rs"]
parakeet = ["dep:parakeet-rs"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
whisper-rs = { version = "0.14", optional = true, features = ["metal"] }
parakeet-rs = { version = "0.3.6", optional = true, default-features = false, features = ["cpu", "ort-defaults"] }

ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
pulldown-cmark = { version = "0.12", default-features = false }
opus = "0.3.1"
ogg = "0.9"

[dependencies.objc2]
version = "0.6"

[dependencies.objc2-foundation]
version = "0.3"

[dependencies.objc2-av-foundation]
version = "0.3"

[dependencies.objc2-core-media]
version = "0.3"

[dependencies.objc2-core-audio]
version = "0.3"

[dependencies.objc2-core-audio-types]
version = "0.3"

[dependencies.objc2-core-foundation]
version = "0.3"

[dependencies.block2]
version = "0.6"

[dependencies.dispatch2]
version = "0.3"

[profile.release]
strip = true
